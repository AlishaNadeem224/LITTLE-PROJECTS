<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ♡</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #ffb3d1;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Brush Script MT', 'Dancing Script', cursive, sans-serif;
        position: relative;
    }

    /* Text falls gently from the top and stops */
    .message {
        font-size: 8vw;
        color: #d4003a;
        text-align: center;
        text-shadow: 0 0 40px rgba(212,0,58,0.6);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: fallIn 4.5s ease-out forwards;
        z-index: 10;
    }
    @keyframes fallIn {
        0%   { transform: translate(-50%, -800%); opacity: 0; }
        60%  { opacity: 1; }
        100% { transform: translate(-50%, -50%); opacity: 1; }
    }

    /* Falling hearts */
    .hearts { position: absolute; width: 100%; height: 100%; pointer-events: none; top: 0; left: 0; }
    .heart {
        position: absolute;
        color: #ff1744;
        font-size: 20px;
        opacity: 0.5;
        animation: fall 14s infinite linear;
        user-select: none;
    }
    @keyframes fall {
        from { transform: translateY(-120px) rotate(0deg); opacity: 0; }
        10%  { opacity: 0.5; }
        to   { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
</style>
</head>
<body>

<div class="message">
    Happy Birthday<br>to you ♡
</div>

<div class="hearts" id="hearts"></div>

<script>
// Create falling hearts
const container = document.getElementById('hearts');
for (let i = 0; i < 110; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = '♥';
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDelay = Math.random() * 12 + 's';
    h.style.animationDuration = 10 + Math.random() * 14 + 's';
    h.style.fontSize = (14 + Math.random() * 20) + 'px';
    container.appendChild(h);
}
</script>

</body>
</html>
